name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - name: Test Codex Pi runner with synthetic fixtures
        run: python -m unittest discover -s plugins/codex-pi-coordination/tests -p 'test_*.py' -v
      - name: Test native Pi extension contract
        run: node --test plugins/codex-pi-coordination/tests/extension.test.mjs
      - run: git diff --check
