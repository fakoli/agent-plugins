name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --project plugins/repo-graph --extra semantic --locked
      - run: uv run --project plugins/repo-graph python -m unittest discover -s tests -v
      - run: node tests/test_repo_graph_views.cjs
      - run: git diff --check
